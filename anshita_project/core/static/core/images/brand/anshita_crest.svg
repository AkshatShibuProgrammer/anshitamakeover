<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" class="crest-svg" id="monogram-svg">
    <defs>
        <!-- Liquid Gold Shimmer Gradients -->
        <linearGradient id="goldStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C59A3F" />
            <stop offset="25%" stop-color="#FDF0CD" />
            <stop offset="50%" stop-color="#D4AF37" />
            <stop offset="75%" stop-color="#AA7A1E" />
            <stop offset="100%" stop-color="#F5DF93" />
        </linearGradient>

        <linearGradient id="goldFillGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8C6212" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#FFF2B2" stop-opacity="0.95" />
        </linearGradient>

        <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Architectural Medallion Ring -->
    <circle class="vector-path path-ring-outer" cx="250" cy="230" r="180" 
            fill="none" stroke="url(#goldStrokeGrad)" stroke-width="1.5" stroke-dasharray="1131" stroke-dashoffset="1131" />

    <circle class="vector-path path-ring-inner" cx="250" cy="230" r="172" 
            fill="none" stroke="url(#goldStrokeGrad)" stroke-width="0.75" stroke-opacity="0.6" stroke-dasharray="1080" stroke-dashoffset="1080" />

    <!-- Royal Crown / Crest Finial -->
    <g class="vector-path path-crown" stroke="url(#goldStrokeGrad)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 215,85 L 230,105 L 250,75 L 270,105 L 285,85 L 280,115 L 220,115 Z" />
        <circle cx="215" cy="80" r="2.5" fill="url(#goldStrokeGrad)" />
        <circle cx="250" cy="70" r="3.5" fill="url(#goldStrokeGrad)" />
        <circle cx="285" cy="80" r="2.5" fill="url(#goldStrokeGrad)" />
    </g>

    <!-- Symmetrical Floral Filigree Flares -->
    <g class="vector-path path-flourish" stroke="url(#goldStrokeGrad)" stroke-width="1.4" fill="none" stroke-linecap="round">
        <!-- Left Flourish -->
        <path d="M 120,230 C 120,180 150,150 190,165 C 165,175 155,200 160,225 C 145,215 135,225 130,240 C 125,235 120,230 120,230 Z" />
        <path d="M 105,230 Q 140,245 170,235" stroke-dasharray="4 4" stroke-width="1" />
        <!-- Right Flourish -->
        <path d="M 380,230 C 380,180 350,150 310,165 C 335,175 345,200 340,225 C 355,215 365,225 370,240 C 375,235 380,230 380,230 Z" />
        <path d="M 395,230 Q 360,245 330,235" stroke-dasharray="4 4" stroke-width="1" />
    </g>

    <!-- Interlocking Haute Couture "AM" Monogram Calligraphy -->
    <g id="monogram-letters" filter="url(#royalGlow)">
        <!-- Letter "A" Calligraphy Swashes -->
        <path class="vector-path path-letter-a1" 
              d="M 180,310 C 190,260 215,180 245,145 C 255,160 270,220 295,310" 
              fill="none" stroke="url(#goldStrokeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Letter "A" Horizontal Crossbar -->
        <path class="vector-path path-letter-a2" 
              d="M 200,250 Q 245,238 280,252" 
              fill="none" stroke="url(#goldStrokeGrad)" stroke-width="2.2" stroke-linecap="round" />

        <!-- Letter "M" Interlocking Couture Swashes -->
        <path class="vector-path path-letter-m" 
              d="M 220,310 C 230,220 240,165 260,165 C 275,165 285,225 295,270 C 305,225 315,165 330,165 C 345,165 355,240 360,310" 
              fill="none" stroke="url(#goldStrokeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
              
        <!-- Couture Swash Underline -->
        <path class="vector-path path-swash" 
              d="M 165,335 C 220,350 280,350 335,335 C 300,345 200,345 165,335 Z" 
              fill="url(#goldFillGrad)" stroke="url(#goldStrokeGrad)" stroke-width="0.8" />
    </g>

    <!-- Typography Beneath Crest -->
    <g class="crest-typography" text-anchor="middle">
        <text x="250" y="440" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="600" 
              letter-spacing="9" fill="url(#goldStrokeGrad)" class="brand-title-text">
            ANSHITA MAKEOVER
        </text>
        <text x="250" y="465" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="400" 
              letter-spacing="5" fill="#D4AF37" opacity="0.8" class="brand-subtitle-text">
            HAUTE COUTURE BRIDAL ARTISTRY
        </text>
    </g>
</svg>
