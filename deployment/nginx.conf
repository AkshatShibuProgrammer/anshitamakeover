# Anshita Makeover — Nginx Production Configuration
# Oracle Cloud Always-Free ARM64 Instance
# Domain: anshita.in (update as needed)

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name anshita.in www.anshita.in;
    return 301 https://$host$request_uri;
}

# HTTPS main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anshita.in www.anshita.in;

    # Let's Encrypt SSL (generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/anshita.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anshita.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/anshita_access.log;
    error_log /var/log/nginx/anshita_error.log;

    # Max upload size (for gallery photos)
    client_max_body_size 50M;

    # Static files — serve directly with aggressive caching
    location /static/ {
        alias /var/www/anshita/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        gzip_static on;
    }

    # Media files — serve directly with moderate caching
    location /media/ {
        alias /var/www/anshita/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Django app — proxy to Gunicorn via Unix socket
    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
