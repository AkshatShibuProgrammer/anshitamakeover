  var targetBtn = document.querySelector('.adm-tab-btn[data-tab="' + tabId + '"]');
  var targetContent = document.getElementById('adm-' + tabId);
  if(targetBtn) targetBtn.classList.add('active');
  if(targetContent) targetContent.classList.add('active');
}

/* ── Partner Addons & Vendor Commission / ROI CRUD ── */
function calcAddonROI(){
  const vCost = parseFloat(document.getElementById('ep-vendor-cost')?.value) || 0;
  const price = parseFloat(document.getElementById('ep-price')?.value) || 0;
  const profitEl = document.getElementById('roi-profit');
  const marginEl = document.getElementById('roi-margin');
  const pctEl = document.getElementById('roi-pct');

  if(price > 0 && vCost >= 0){
    const profit = Math.max(0, price - vCost);
    const margin = price > 0 ? ((profit / price) * 100).toFixed(1) : 0;
    const roi = vCost > 0 ? ((profit / vCost) * 100).toFixed(1) : (profit > 0 ? 100 : 0);

    if(profitEl) profitEl.textContent = `₹${Math.round(profit).toLocaleString('en-IN')}`;
    if(marginEl) marginEl.textContent = `${margin}%`;
    if(pctEl) pctEl.textContent = `${roi}%`;
  } else {
    if(profitEl) profitEl.textContent = '₹0';
    if(marginEl) marginEl.textContent = '0%';
    if(pctEl) pctEl.textContent = '0%';
  }
}

    'decor': 'Grand Floral Mandap & Royal Entrance Decor',
    'catering': 'Royal Heritage Buffet (Per Plate Luxury Catering)',

    'full_event': 'Complete Wedding Event Choreography & Production',
    'custom': 'Bespoke VIP Partner Celebration Suite'
  };
  if(suggestions[cat]) nameInp.value = suggestions[cat];
}

  const cat=document.getElementById('ep-cat')?.value || 'custom';
  const vCost=document.getElementById('ep-vendor-cost')?.value || '0';
  const price=document.getElementById('ep-price')?.value || null;

  const data={
    name,
    category: cat,
    package_type: 'custom',
    vendor_cost: vCost,
    price: price,
    price_label: price ? '' : 'On Request',
    features: document.getElementById('ep-feats')?.value || '',
    description: document.getElementById('ep-desc')?.value || '',
    is_featured: document.getElementById('ep-feat')?.checked || false,
    is_active: document.getElementById('ep-active')?.checked || false

  const r=await fetch('/api/admin/event-package/',{
    method:'POST',

    body:JSON.stringify(data)

    alert(`✨ Partner Package Saved!\nStudio Profit: ₹${Math.round(d.commission).toLocaleString('en-IN')} (${d.margin_pct}% margin · ${d.roi_pct}% ROI)`);

async function askAiBundleSuggester(){
  const inp = document.getElementById('ai-bundle-inp');
  const prompt = inp ? inp.value.trim() : '';
  const out = document.getElementById('ai-bundle-response');
  if(!prompt){
    alert('Please enter a prompt or click a pill.');
    return;
  }
  if(out){
    out.style.display = 'block';
    out.textContent = '⏳ AI Copilot analyzing vendor pricing, bundle discounts, and studio ROI...';
  }

  try {
    const res = await fetch('/api/admin/ai-command/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
      body: JSON.stringify({prompt: `Analyze and suggest bundle pricing with ROI: ${prompt}`})
    });
    const d = await res.json();
    if(out){
      if(d.ok){
        out.textContent = d.message || JSON.stringify(d.action_executed, null, 2);
      } else {
        out.textContent = `Notice: ${d.error || 'AI processed with local recommendations.'}`;
      }
    }
  } catch(e) {
    if(out) out.textContent = 'Recommendation: Combine external vendor service with studio bridal makeup. For a 10% client saving, ensure client quote preserves minimum ₹15,000–₹25,000 studio margin.';
  }
}

function toggleArtSpec(spec){
  const inp=document.getElementById('art-specs');
  let vals=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
  if(vals.includes(spec)){
    vals=vals.filter(s=>s!==spec);
  } else {
    vals.push(spec);
  }
  inp.value=vals.join(', ');
}

async function saveLookGroup(){
  const id = document.getElementById('lg-id')?.value;
  const clientName = document.getElementById('lg-client-name').value.trim();
  const makeupType = document.getElementById('lg-makeup-type').value.trim();
  if(!makeupType){ alert('Please enter the type of makeup (e.g. Traditional Bengali Mukut & Chandan).'); return; }

  const fd = new FormData();
  fd.append('csrfmiddlewaretoken', getCsrf());
  if (id) {
    fd.append('id', id);
  }
  fd.append('client_name', clientName);
  fd.append('makeup_type', makeupType);
  fd.append('name', clientName ? `${clientName} — ${makeupType}` : makeupType);
  fd.append('category', document.getElementById('lg-category').value);

  const coverFile = document.getElementById('lg-cover-file');
  if(coverFile.files && coverFile.files[0]){
    fd.append('cover_file', coverFile.files[0]);
  }

  const btn = document.getElementById('lg-save-btn');
  btn.disabled = true;
  btn.textContent = id ? 'Updating Folder...' : 'Creating Folder...';

  try {
    const res = await fetch('/api/admin/lookgroup/', { method: 'POST', body: fd });
    const data = await res.json();
    if(data.ok){
      alert(`Look Group Folder "${data.group.name}" saved!`);
      location.reload();
    } else {
      alert(data.error || 'Failed to save look group.');
    }
  } catch(e){
    alert('An error occurred.');
  } finally {
    btn.disabled = false;
  }
}

  const cancelBtn = document.getElementById('lg-cancel-btn');

  if (idEl) idEl.value = id;

  if (catEl) catEl.value = category || 'bridal';

// Admin Configurable Offer Constants (with dynamic fallbacks)
window.OFFER_CONFIG = {
  freeSides: parseInt("{{ site.offer_bridal_free_sides|default:2 }}", 10) || 2,
  discSideRate: parseFloat("{{ site.offer_next_sides_discounted_price|default:2500 }}") || 2500,
  comboDiscPercent: parseInt("{{ site.offer_combo_discount_percent|default:15 }}", 10) || 15,
  comboFlatPrice: parseFloat("{{ site.offer_grand_combo_bundle_price|default:50000 }}") || 50000,
  standardSideRate: 6500,
  rulesActive: {% if site.offer_rules_active %}true{% else %}false{% endif %}
};

function updateCalc(){
  const locEl = document.getElementById('calc-loc');
  const pkgEl = document.getElementById('calc-pkg');
  const daysEl = document.getElementById('calc-days');
  const sidesEl = document.getElementById('calc-sides');
  const engCb = document.getElementById('calc-add-engagement');
  const comboWrap = document.getElementById('calc-combo-wrap');
  const savingsBadge = document.getElementById('calc-savings-badge');
  if(!locEl || !pkgEl || !daysEl || !sidesEl) return;

  const loc = locEl.value;
  const selectedOption = pkgEl.selectedOptions[0];
  let bridalFee = parseInt(pkgEl.value, 10) || 35000;
  const days = parseInt(daysEl.value, 10) || 1;
  const sideCount = parseInt(sidesEl.value, 10) || 0;
  const isBridal = selectedOption?.dataset?.isBridal === 'true' || bridalFee >= 35000;
  const isDedicatedCombo = selectedOption?.dataset?.isCombo === 'true';

  // Toggle visibility/state of the "Add Engagement" combo checkbox if already a dedicated combo or engagement
  if(comboWrap){
    if(isDedicatedCombo || bridalFee === 18000){
      comboWrap.style.display = 'none';
    } else {
      comboWrap.style.display = 'block';
    }
  }

  const addEngagement = (engCb && engCb.checked && comboWrap && comboWrap.style.display !== 'none');

  // Travel / Outstation Fee Calculation
  let locFee = 0;
  let locBreakdown = '';
  if(loc === 'outstation'){
    locFee = 18000 * days;
    locBreakdown = `Outstation Surcharge (${days} Day${days>1?'s':''}): ₹${locFee.toLocaleString('en-IN')}`;
  } else if(loc === 'local'){
    locFee = 2500 * days;
    locBreakdown = `Local Conveyance (${days} Day${days>1?'s':''}): ₹${locFee.toLocaleString('en-IN')}`;
  } else {
    locBreakdown = `Studio Jabalpur: ₹0 travel surcharge`;
  }

  // Side Makeup Calculation with User's Exact Privilege Offer Rules:
  // - If Bridal booking is active: 2 side makeups FREE
  // - Next 2 side makeups (3rd & 4th) at discounted rate (e.g. ₹2,500 - ₹3,000)
  // - 5th and subsequent at standard ₹6,500 (or Trio group)
  let sideFee = 0;
  let totalSavings = 0;
  let sideBreakdown = '';

  const cfg = window.OFFER_CONFIG;
  if(sideCount > 0){
    if(isBridal && cfg.rulesActive){
      const freeCount = Math.min(sideCount, cfg.freeSides); // up to 2 FREE
      const remainingAfterFree = Math.max(0, sideCount - freeCount);
      const discountedCount = Math.min(remainingAfterFree, 2); // next 2 at ₹2,500 - ₹3,000
      const standardCount = Math.max(0, remainingAfterFree - discountedCount);

      sideFee = (discountedCount * cfg.discSideRate) + (standardCount * cfg.standardSideRate);
      const standardOriginalFee = sideCount * cfg.standardSideRate;
      totalSavings += (standardOriginalFee - sideFee);

      let parts = [];
      if(freeCount > 0) parts.push(`${freeCount} FREE`);
      if(discountedCount > 0) parts.push(`${discountedCount} @ ₹${cfg.discSideRate.toLocaleString('en-IN')}`);
      if(standardCount > 0) parts.push(`${standardCount} @ ₹${cfg.standardSideRate.toLocaleString('en-IN')}`);
      sideBreakdown = `${sideCount} Side Makeups (${parts.join(' + ')}): ₹${sideFee.toLocaleString('en-IN')}`;
    } else {
      // Standard calculation with trio privilege
      const trios = Math.floor(sideCount / 3);
      const singles = sideCount % 3;
      sideFee = (trios * 16500) + (singles * 6500);
      sideBreakdown = `${sideCount} Side Makeup${sideCount>1?'s':''}: ₹${sideFee.toLocaleString('en-IN')}`;
    }
  }

  // Base Package & Combo calculations
  let pkgBreakdown = `Bridal Suite: ₹${bridalFee.toLocaleString('en-IN')}`;
  let comboFee = 0;

  if(addEngagement){
    // Bridal + Engagement Combo: Add engagement (18,000 standard) with combo discount (e.g. 15% or capped 20%)
    const rawEng = 18000;
    const comboDiscRate = cfg.comboDiscPercent / 100;
    const engDiscounted = Math.round(rawEng * (1 - comboDiscRate));
    comboFee = engDiscounted;
    totalSavings += (rawEng - engDiscounted);
    pkgBreakdown = `Bridal Suite: ₹${bridalFee.toLocaleString('en-IN')} + Engagement Combo: ₹${engDiscounted.toLocaleString('en-IN')} (${cfg.comboDiscPercent}% OFF)`;
  } else if(isDedicatedCombo){
    pkgBreakdown = `Grand Royal Bridal & Engagement Suite: ₹${bridalFee.toLocaleString('en-IN')} (VIP Bundle Rate)`;
    totalSavings += 8000; // standard 35k + 18k + 5k = 58k value
  }

  const grandTotal = bridalFee + comboFee + locFee + sideFee;

  document.getElementById('calc-total-display').innerText = '₹' + grandTotal.toLocaleString('en-IN');
  
  let parts = [pkgBreakdown];
  if(locBreakdown) parts.push(locBreakdown);
  if(sideBreakdown) parts.push(sideBreakdown);
  document.getElementById('calc-breakdown-text').innerText = parts.join(' · ');

  if(savingsBadge){
    if(totalSavings > 0){
      savingsBadge.style.display = 'inline-block';
      savingsBadge.innerText = `✦ Total VIP Privilege Savings: ₹${totalSavings.toLocaleString('en-IN')} Applied!`;
    } else {
      savingsBadge.style.display = 'none';
    }
  }

  const noteEl = document.getElementById('calc-note-text');
  if(loc === 'outstation'){
    noteEl.innerText = '*Note: Client provides return travel (flights/train + airport cabs) & 4/5-star accommodation for Anshita + 1 assistant.';
  } else if(loc === 'local'){
    noteEl.innerText = '*Note: Includes on-site arrival at your venue/hotel with full makeup lights & setup.';
  } else {
    noteEl.innerText = '*Note: Private studio suite session at Jabalpur studio with personalized vanity amenities.';
  }
}
