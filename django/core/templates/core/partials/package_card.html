<article class="package-card"><span class="catalog-tag">{{ package.get_package_type_display }}</span><h2>{{ package.name }}</h2><p>{{ package.tagline }}</p><div class="package-price">{% if package.price %}From ₹{{ package.price|floatformat:0 }}{% else %}On request{% endif %}</div><ul>{% for item in package.get_features_list|slice:':4' %}<li>{{ item }}</li>{% endfor %}</ul><div class="package-actions"><a class="btn-o" href="{% url 'package_detail' package.id %}">View details</a><button class="btn-p" type="button" onclick="AnshitaCart.addItem({id:'package-{{ package.id }}',title:'{{ package.name|escapejs }}',price:{{ package.price|default:0 }},category:'package'})">Add to plan</button></div></article>
